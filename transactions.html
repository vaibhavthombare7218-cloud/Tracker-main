
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b0b18">
<title>जमा खर्च व्यवहार</title>
<style>
body{margin:0;background:#f6f3f4;color:#292124;font-family:Arial,sans-serif}
header{background:#5b0b18;color:white;padding:20px}
main{max-width:800px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:14px}
input,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px}
button,.btn{background:#5b0b18;color:white;padding:12px 16px;border:0;border-radius:8px;text-decoration:none;display:inline-block;margin:4px 4px 4px 0;cursor:pointer}
.tx{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
small{color:#76696c}.income{color:green}.expense{color:#b42332}
</style>
</head>
<body>
<header>
<h2>जमा खर्च व्यवहार</h2>
<div>रोजचा जमा खर्च अहवाल</div>
</header>
<main>
<section class="card">
<h3>नवीन व्यवहार</h3>
<form id="form">
<label>व्यवहार प्रकार</label>
<select id="type">
<option value="expense">खर्च</option>
<option value="income">जमा</option>
</select>

<label>तारीख</label>
<input id="date" type="date" required>

<label>रक्कम (₹)</label>
<input id="amount" type="number" min="0.01" step="0.01" required>

<label>खाते</label>
<select id="account" required></select>

<label>कॅटेगरी</label>
<select id="category">
<option value="daily_grocery">दररोजचा किराणा खर्च</option>
<option value="monthly_grocery">महिन्याचा किराणा खर्च</option>
<option value="travel">प्रवास</option>
<option value="shopping">खरेदी</option>
<option value="electricity">लाईट बिल</option>
<option value="medicine">औषधे</option>
<option value="mobile">मोबाईल</option>
<option value="home_emi">घरचा EMI</option>
<option value="home_maintenance">घरचा मेंटेनन्स</option>
<option value="other_loan">इतर लोन</option>
<option value="fish">मच्छी</option>
<option value="outside_food">बाहेर जेवण</option>
<option value="insurance">विमा योजना</option>
<option value="other">Other</option>
</select>

<label>तपशील</label>
<input id="note" placeholder="व्यवहाराची नोंद">

<button type="submit">व्यवहार सेव्ह करा</button>
</form>
<p id="msg"></p>
<a class="btn" href="./index.html">डॅशबोर्ड</a>
<a class="btn" href="./account.html">खाती</a>
</section>

<section class="card">
<h3>व्यवहारांचा आढावा</h3>
<p>एकूण जमा: <strong id="income">₹0.00</strong></p>
<p>एकूण खर्च: <strong id="expense">₹0.00</strong></p>
<p>निव्वळ रक्कम: <strong id="net">₹0.00</strong></p>
</section>

<section class="card">
<h3>व्यवहारांची यादी</h3>
<div id="list"></div>
</section>
</main>
<script>
"use strict";

const K={
 transactions:"RJKA_v1_transactions",
 accounts:"RJKA_v1_accounts",
 budgets:"RJKA_v1_budgets",
 lending:"RJKA_v1_lending",
 workplan:"RJKA_v1_workplan",
 settings:"RJKA_v1_settings"
};

function read(key,fallback){
 try{
  const value=JSON.parse(localStorage.getItem(key));
  return Array.isArray(value)?value:fallback;
 }catch(e){return fallback;}
}
function save(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}
function init(){
 let accounts=read(K.accounts,null);
 if(!accounts||accounts.length===0){
  accounts=[
   {id:"RJKA-ACC-001",name:"UPI",openingBalance:0},
   {id:"RJKA-ACC-002",name:"Cash",openingBalance:0},
   {id:"RJKA-ACC-003",name:"Bank",openingBalance:0}
  ];
  save(K.accounts,accounts);
 }
 if(localStorage.getItem(K.transactions)===null)save(K.transactions,[]);
 if(localStorage.getItem(K.budgets)===null)save(K.budgets,[]);
 if(localStorage.getItem(K.lending)===null)save(K.lending,[]);
 if(localStorage.getItem(K.workplan)===null)save(K.workplan,[]);
 if(localStorage.getItem(K.settings)===null)
  save(K.settings,{currency:"₹",firstDayOfWeek:"monday",financialYearStartMonth:4});
}
function money(n){
 return "₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fillAccounts(){
 const select=document.getElementById("account");
 select.replaceChildren();
 read(K.accounts,[]).forEach(a=>{
  const option=document.createElement("option");
  option.value=a.id;
  option.textContent=a.name;
  select.append(option);
 });
}
function render(){
 const txs=read(K.transactions,[]);
 const accounts=read(K.accounts,[]);
 const income=txs.filter(t=>t.type==="income").reduce((s,t)=>s+(Number(t.amount)||0),0);
 const expense=txs.filter(t=>t.type==="expense").reduce((s,t)=>s+(Number(t.amount)||0),0);

 document.getElementById("income").textContent=money(income);
 document.getElementById("expense").textContent=money(expense);
 document.getElementById("net").textContent=money(income-expense);

 const list=document.getElementById("list");
 list.replaceChildren();

 txs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(t=>{
  const row=document.createElement("div");
  row.className="tx";

  const info=document.createElement("div");
  const title=document.createElement("strong");
  title.textContent=t.note||t.category||t.type;
  const detail=document.createElement("small");
  const account=accounts.find(a=>a.id===t.accountId);
  detail.textContent=(t.date||"")+" · "+(account?account.name:"खाते उपलब्ध नाही");
  info.append(title,document.createElement("br"),detail);

  const amount=document.createElement("strong");
  amount.className=t.type==="income"?"income":"expense";
  amount.textContent=(t.type==="income"?"+":"−")+money(t.amount);

  row.append(info,amount);
  list.append(row);
 });
 if(!txs.length)list.textContent="अद्याप कोणताही व्यवहार नोंदवलेला नाही.";
}

document.getElementById("date").value=new Date().toLocaleDateString("en-CA");

document.getElementById("form").addEventListener("submit",function(e){
 e.preventDefault();

 const amount=Number(document.getElementById("amount").value);
 const accountId=document.getElementById("account").value;
 const date=document.getElementById("date").value;

 if(!accountId){
  document.getElementById("msg").textContent="कृपया आधी खाते जोडा.";
  return;
 }
 if(!Number.isFinite(amount)||amount<=0||!date){
  document.getElementById("msg").textContent="योग्य तारीख आणि रक्कम भरा.";
  return;
 }

 const txs=read(K.transactions,[]);
 txs.push({
  id:"RJKA-TX-"+Date.now(),
  type:document.getElementById("type").value,
  date:date,
  amount:amount,
  accountId:accountId,
  category:document.getElementById("category").value,
  note:document.getElementById("note").value.trim(),
  createdAt:new Date().toISOString()
 });

 try{
  save(K.transactions,txs);
  document.getElementById("amount").value="";
  document.getElementById("note").value="";
  document.getElementById("msg").textContent="व्यवहार सेव्ह झाला.";
  render();
 }catch(err){
  document.getElementById("msg").textContent="सेव्ह करताना त्रुटी: "+err.message;
 }
});

try{init();fillAccounts();render();}
catch(e){document.getElementById("msg").textContent="त्रुटी: "+e.message;}
</script>
</body>
</html>
