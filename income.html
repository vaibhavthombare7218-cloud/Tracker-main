<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b0b18"><title>जमा (Income) | रोजचा जमा खर्च अहवाल</title><style>
:root{--maroon:#5b0b18;--maroon2:#781527;--bg:#f5f2f3;--card:#fff;--text:#261d20;--muted:#75696d;--line:#eadfe2;--green:#16834b;--red:#c03945;--shadow:0 5px 20px #2b10140d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:var(--maroon);color:#fff;padding:15px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:750}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:8px 12px;border-radius:10px}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:25px;margin:0}p{margin:5px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.card h2{font-size:17px;margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:650;color:#59494e}input,select,textarea{width:100%;border:1px solid #d9cbd0;border-radius:10px;padding:11px;background:white;color:var(--text);font:inherit;min-width:0}textarea{min-height:42px;resize:vertical}.btn{border:0;background:var(--maroon);color:#fff;padding:11px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#f3e8eb;color:var(--maroon)}.btn.danger{background:#fff0f0;color:var(--red)}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px;overflow-wrap:anywhere}.positive{color:var(--green)}.negative{color:var(--red)}.table-wrap{overflow:auto}table{width:100%;border
