
<!DOCTYPE html>
<html lang="mr">
<head>
 <link rel="stylesheet" href="./style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b0b18">
<title>खाती | रोजचा जमा खर्च अहवाल</title>
<style>
body{margin:0;background:#f6f3f4;color:#292124;font-family:Arial,sans-serif}
header{background:#5b0b18;color:white;padding:20px}
main{max-width:700px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:14px}
input{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px}
button,.btn{background:#5b0b18;color:white;padding:12px 16px;border:0;border-radius:8px;text-decoration:none;display:inline-block;margin:4px 4px 4px 0;cursor:pointer}
.account{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}
small{color:#76696c}
</style>
</head>
<body>
<header>
<h2>खाती (Accounts)</h2><a href="index.html">← डॅशबोर्ड</a>
<div>रोजचा जमा खर्च अहवाल</div>
</header>
<main>
<section class="card">
<h3>नवीन खाते जोडा</h3>
<form id="accountForm">
<label>खात्याचे नाव</label>
<input id="name" required placeholder="UPI / Cash / Bank">
<label>सुरुवातीची शिल्लक (₹)</label>
<input id="balance" type="number" min="0" step="0.01" value="0" required>
<button type="submit">खाते सेव्ह करा</button>
</form>
<p id="msg"></p>
<a class="btn" href="./index.html">डॅशबोर्ड</a>
<a class="btn" href="./transactions.html">व्यवहार</a>
</section>
<section class="card">
<h3>माझी खाती</h3>
<div id="list"></div>
</section>
</main>
<script>
"use strict";

const K={
 transactions:"RJKA_v1_transactions",
 accounts:"RJKA_v1_accounts",
 budgets:"RJKA_v1_budgets",
 lending:"RJKA_v1_lending",
 workplan:"RJKA_v1_workplan",
 settings:"RJKA_v1_settings"
};

function read(key, fallback){
 try{
  const value=JSON.parse(localStorage.getItem(key));
  return Array.isArray(value)?value:fallback;
 }catch(e){return fallback;}
}
function save(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}
function init(){
 let accounts=read(K.accounts,null);
 if(!accounts || accounts.length===0){
  accounts=[
   {id:"RJKA-ACC-001",name:"UPI",openingBalance:0},
   {id:"RJKA-ACC-002",name:"Cash",openingBalance:0},
   {id:"RJKA-ACC-003",name:"Bank",openingBalance:0}
  ];
  save(K.accounts,accounts);
 }
 if(localStorage.getItem(K.transactions)===null)save(K.transactions,[]);
 if(localStorage.getItem(K.budgets)===null)save(K.budgets,[]);
 if(localStorage.getItem(K.lending)===null)save(K.lending,[]);
 if(localStorage.getItem(K.workplan)===null)save(K.workplan,[]);
 if(localStorage.getItem(K.settings)===null)
  save(K.settings,{currency:"₹",firstDayOfWeek:"monday",financialYearStartMonth:4});
}
function money(n){
 return "₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function render(){
 const accounts=read(K.accounts,[]);
 const txs=read(K.transactions,[]);
 const list=document.getElementById("list");
 list.replaceChildren();

 if(!accounts.length){
  list.textContent="खाती उपलब्ध नाहीत.";
  return;
 }

 accounts.forEach(a=>{
  const movement=txs.reduce((sum,t)=>{
   if(t.accountId!==a.id)return sum;
   return sum+(t.type==="income"?1:t.type==="expense"?-1:0)*(Number(t.amount)||0);
  },0);

  const row=document.createElement("div");
  row.className="account";
  const title=document.createElement("span");
  title.textContent=a.name;
  const amount=document.createElement("strong");
  amount.textContent=money((Number(a.openingBalance)||0)+movement);
  row.append(title,amount);
  list.append(row);
 });
}
document.getElementById("accountForm").addEventListener("submit",function(e){
 e.preventDefault();
 const name=document.getElementById("name").value.trim();
 const balance=Number(document.getElementById("balance").value);
 if(!name||!Number.isFinite(balance)||balance<0)return;

 const accounts=read(K.accounts,[]);
 if(accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){
  document.getElementById("msg").textContent="हे खाते आधीपासून आहे.";
  return;
 }

 accounts.push({
  id:"RJKA-ACC-"+Date.now(),
  name:name,
  openingBalance:balance
 });
 save(K.accounts,accounts);
 document.getElementById("name").value="";
 document.getElementById("balance").value="0";
 document.getElementById("msg").textContent="खाते सेव्ह झाले.";
 render();
});
try{init();render();}
catch(e){document.getElementById("list").textContent="त्रुटी: "+e.message;}
</script>
</body>
</html>
