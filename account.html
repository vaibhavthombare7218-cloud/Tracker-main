  </div>  <button class="icon-btn" onclick="location.href='index.html'" title="Dashboard">

</header><div class="app-shell">  <aside class="sidebar" id="sidebar">
    <div class="sidebar-heading">MAIN MENU</div><button class="nav-item" onclick="location.href='index.html'">

</button>

<button class="nav-item" onclick="location.href='income.html'">

</div>

  </aside>  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>  <main class="main-content"><section class="page active">

  <div class="page-heading">
    <div>
      <p class="eyebrow">ACCOUNT MANAGEMENT</p>
      <h1>खाती</h1>
      <p class="muted">
        खाती, सुरुवातीची शिल्लक आणि उपलब्ध शिल्लक व्यवस्थापित करा.

  </footer>

</section>

  </main></div><script src="account.js"></script><script>
(function(){

  const menu = document.getElementById("menuToggle");
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebarBackdrop");

  if(menu){
    menu.addEventListener("click",()=>{
      sidebar.classList.toggle("open");
      backdrop.classList.toggle("show");
    });
  }

  if(backdrop){
    backdrop.addEventListener("click",()=>{
      sidebar.classList.remove("open");
      backdrop.classList.remove("show");
    });
  }

  document.querySelectorAll(".nav-item").forEach(item=>{
    item.addEventListener("click",()=>{
      sidebar.classList.remove("open");
      backdrop.classList.remove("show");
    });
  });

})();
</script></body>
</html>
